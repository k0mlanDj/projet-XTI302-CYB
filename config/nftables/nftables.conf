#!/usr/sbin/nft -f

# Projet XTI302-CYB - Laboratoire BioLab
# Pare-feu entrant J2
# La table Fail2ban est indépendante et doit être préservée.

destroy table inet biolab_filter

table inet biolab_filter {
    chain input {
        type filter hook input priority 0;
        policy drop;

        # Autoriser le trafic local
        iifname "lo" accept

        # Autoriser les connexions établies et associées
        ct state established,related accept

        # Autoriser SSH (IPv4 et IPv6)
        tcp dport 22 accept
    }
}

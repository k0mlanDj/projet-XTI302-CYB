# ============================================================
# Projet XTI302-CYB - Laboratoire BioLab
# Fichier : config/journald/10-biolab-persistance.conf
# Installé dans : /etc/systemd/journald.conf.d/10-biolab-persistance.conf
#                 (root:root 0644)
# Objectif : journaux persistants après redémarrage (J3)
# ============================================================
#
# Fichier de complément (drop-in) : /etc/systemd/journald.conf et les
# fichiers fournis par Debian ne sont pas modifiés. Pour journald, la
# dernière valeur lue l'emporte (fichiers .conf.d lus par ordre alphabétique).
# Configuration effective : systemd-analyze cat-config systemd/journald.conf
# Prise en compte : systemctl restart systemd-journald
#
# Dimensionnement : /var (partition dédiée de 2,1 Go, 1,6 Go libres
# relevés le 04/11/2026) ; occupation du journal : 24 Mo.

[Journal]
# Écriture sur disque dans /var/log/journal/<machine-id>/, répertoire
# créé si besoin. « auto » dépendrait de l'existence préalable du dossier.
Storage=persistent

# Compression des entrées volumineuses (comportement par défaut, explicité).
Compress=yes

# Journal persistant : 300 Mo au plus (environ 14 % de /var), en laissant
# toujours au moins 500 Mo libres sur /var. Fichiers de 30 Mo au plus,
# pour que la rotation libère l'espace par petites tranches.
SystemMaxUse=300M
SystemKeepFree=500M
SystemMaxFileSize=30M

# Conservation maximale de 6 mois (durée de référence pour les traces
# d'accès) ; la limite de taille s'applique en premier si elle est atteinte.
MaxRetentionSec=6month

# Journal volatil (/run, avant le montage de /var) : 50 Mo au plus.
RuntimeMaxUse=50M

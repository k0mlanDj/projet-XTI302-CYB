# ============================================================
# Projet XTI302-CYB - Laboratoire BioLab
# Fichier : config/analyse_logs/analyse_logs.conf
# Installé dans : /etc/biolab/analyse_logs.conf (root:root 0644)
# Utilisé par   : /usr/local/sbin/analyse_logs.sh (J4)
# ============================================================
#
# Format : une directive CLE=valeur par ligne, sans espace ni guillemet.
# Les lignes vides et celles commençant par # sont ignorées.
# Le fichier est lu et validé ligne à ligne ; il n'est jamais exécuté.
# Toute clé inconnue ou valeur invalide arrête le script (code 5).

# Alerte (code de retour 1) dès qu'une adresse IP atteint ce nombre
# d'échecs sur la période. Valeur alignée sur maxretry de fail2ban (J1).
SEUIL_ECHECS_IP=5

# Fenêtre analysée : Nh (heures), Nd (jours), N de 1 à 9999, ou "tout".
PERIODE=24h

# Source des journaux :
#   auto     journald, puis /var/log/auth.log si journald ne contient
#            aucune ligne SSH sur la période (les deux ne sont jamais cumulés)
#   journald journal systemd uniquement (unité ssh.service)
#   authlog  /var/log/auth.log uniquement (nécessite rsyslog)
SOURCE=auto

# Nombre de lignes affichées dans chaque classement (1 à 100).
NB_LIGNES_MAX=10
